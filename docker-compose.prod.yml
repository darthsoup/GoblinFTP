# Production overlay, never used alone (`just docker-up-prod` wraps the -f pair).
# Secrets come from .env or your secret store. Serve behind a TLS-terminating proxy.
services:
  gftp:
    image: "ghcr.io/darthsoup/goblinftp:${GFTP_VERSION:-latest}"
    pull_policy: always
    environment:
      # Without these the server generates ephemeral keys on each start, invalidating
      # sessions and download links; the `:?` form fails fast when they are unset.
      GFTP_SESSION_SECRET: "${GFTP_SESSION_SECRET:?set GFTP_SESSION_SECRET (openssl rand -hex 32)}"
      GFTP_DOWNLOAD_TOKEN_SECRET: "${GFTP_DOWNLOAD_TOKEN_SECRET:?set GFTP_DOWNLOAD_TOKEN_SECRET (openssl rand -hex 32)}"
    volumes:
      - gftp-data:/app/data

volumes:
  gftp-data:
