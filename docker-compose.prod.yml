# Production overlay, never used alone (`just docker-up-prod` wraps the -f pair).
# Secrets come from .env or your secret store. Serve behind a TLS-terminating proxy.
services:
  gftp:
    image: "ghcr.io/darthsoup/goblinftp:${GFTP_VERSION:-latest}"
    pull_policy: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - gftp-data:/app/data

volumes:
  gftp-data:
