# Base compose config, shared by development and production.
#
#   Dev:  docker compose up --build
#         (docker-compose.override.yml is auto-merged; builds from source and
#          provides the FTP/FTPS/SFTP/S3 test servers)
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#         (pulls the published image, requires secrets, persists /app/data)
#
# The `just docker-up` / `docker-up-prod` recipes wrap these commands.
services:
  gftp:
    image: ghcr.io/darthsoup/goblinftp
    ports:
      - "8080:80"
    environment:
      GFTP_PAGE_TITLE: "${GFTP_PAGE_TITLE:-GoblinFTP}"
      GFTP_SESSION_SECRET: "${GFTP_SESSION_SECRET:-}"
      GFTP_DOWNLOAD_TOKEN_SECRET: "${GFTP_DOWNLOAD_TOKEN_SECRET:-}"
      GFTP_SSO_ENABLED: "${GFTP_SSO_ENABLED:-false}"
      GFTP_SSO_SECRET: "${GFTP_SSO_SECRET:-}"
      GFTP_SENTRY_DSN: "${GFTP_SENTRY_DSN:-}"
      # Optional S3 chunk staging (see docs/s3-staging.md):
      GFTP_S3_ENABLED: "${GFTP_S3_ENABLED:-false}"
      GFTP_S3_ENDPOINT: "${GFTP_S3_ENDPOINT:-}"
      GFTP_S3_BUCKET: "${GFTP_S3_BUCKET:-}"
      GFTP_S3_ACCESS_KEY: "${GFTP_S3_ACCESS_KEY:-}"
      GFTP_S3_SECRET_KEY: "${GFTP_S3_SECRET_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
