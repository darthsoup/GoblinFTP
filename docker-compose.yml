# Base compose config, shared by development and production.
#
#   Dev:  docker compose up --build
#         (docker-compose.override.yml is auto-merged; builds from source and
#          provides the FTP/FTPS/SFTP/S3 test servers)
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#         (pulls the published image, requires secrets, persists /app/data)
#
# The `just docker-up` / `docker-up-prod` recipes wrap these commands.
services:
  gftp:
    image: ghcr.io/darthsoup/goblinftp
    ports:
      - "8080:80"
      # Prometheus metrics listener. Uncomment together with
      # GFTP_METRICS_ENABLED=true in .env; see docs/metrics.md.
      # - "9091:9091"
    # Every GFTP_* variable in .env reaches the container (optional form needs
    # Compose v2.24+). The healthcheck lives in the image (port 80 via Caddy).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
