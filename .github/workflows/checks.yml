name: Checks

# Reusable gate jobs shared by ci.yml (branches/PRs) and release.yml (tags).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # -race matters here: the session store, the per-session transfer lock,
      # the SSO replay set and the login throttle are all shared mutable state.
      - name: Run tests
        working-directory: backend
        run: go test -race ./... -v

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # keep in sync with the local install (brew install golangci-lint)
          working-directory: backend

  backend-vuln:
    name: Backend vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # golangci's gosec finds our bugs; govulncheck finds our dependencies'.
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: i18n parity
        run: node frontend/scripts/i18n-check.mjs
      - name: Lint
        run: pnpm --filter goblinftp-frontend run lint
      # nuxt generate does not typecheck, so a type error would otherwise merge
      # as long as the build succeeds. Needs .nuxt, which nuxt typecheck prepares.
      - name: Typecheck
        run: pnpm --filter goblinftp-frontend run typecheck
      - name: Generate SPA
        run: pnpm --filter goblinftp-frontend run generate

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # vitest's nuxt environment reads .nuxt/tsconfig.json, and there is no postinstall hook to create it.
      - name: Prepare Nuxt types
        run: pnpm --filter goblinftp-frontend exec nuxt prepare
      - name: Unit tests
        run: pnpm --filter goblinftp-frontend run test
